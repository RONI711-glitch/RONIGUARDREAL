name: Deploy to Wasmer Edge

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Assets & Bundles
        run: npm run build

      - name: Install Wasmer CLI
        uses: wasmerio/setup-wasmer@v3

      - name: Deploy to Wasmer Edge
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          if [ -n "$WASMER_TOKEN" ]; then
            wasmer deploy --no-confirm
          else
            echo "WASMER_TOKEN secret is not set. If Wasmer is connected directly via Git in Wasmer dashboard, it deploys automatically."
          fi
