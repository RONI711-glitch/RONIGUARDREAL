name: Deploy to Wasmer Edge

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Assets & Bundles
        run: npm run build

      - name: Install Wasmer CLI
        uses: wasmerio/setup-wasmer@v3

      - name: Deploy to Wasmer Edge
        if: env.WASMER_TOKEN != ''
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: wasmer deploy --no-confirm
