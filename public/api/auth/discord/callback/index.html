<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authenticating with Discord | RONIGUARD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #07040d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(168, 85, 247, 0.2);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #c084fc;
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.82rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">Authenticating Discord Session...</div>
  <div class="sub">Please wait while RONIGUARD securely authorizes your account.</div>

  <script>
    (async function() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const code = urlParams.get('code');
        const error = urlParams.get('error') || hashParams.get('error');

        if (error) {
          window.location.href = '/?auth_error=' + encodeURIComponent(error);
          return;
        }

        // 1. If authorization code is present: exchange via backend or direct token
        if (code) {
          try {
            // Attempt exchange via Discord OAuth API
            const tokenRes = await fetch('https://discord.com/api/oauth2/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                client_id: '1549804529778692237',
                client_secret: 'qsFyL7ATcLvCKqESUypjskBwa5NuKkWZ',
                grant_type: 'authorization_code',
                code: code,
                redirect_uri: 'https://roniguardreal.wasmer.app/api/auth/discord/callback'
              })
            });

            if (tokenRes.ok) {
              const tokenData = await tokenRes.json();
              const userRes = await fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: 'Bearer ' + tokenData.access_token }
              });

              if (userRes.ok) {
                const discordUser = await userRes.json();
                const sessionToken = 'roni_tok_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
                
                // Store in browser storage
                localStorage.setItem('roniguard_owner_token', sessionToken);
                localStorage.setItem('roniguard_discord_user', JSON.stringify(discordUser));
                document.cookie = 'roni_user_token=' + encodeURIComponent(sessionToken) + '; path=/; max-age=2592000; SameSite=Lax';

                window.location.href = '/?auth_token=' + encodeURIComponent(sessionToken) + '&username=' + encodeURIComponent(discordUser.username);
                return;
              }
            }
          } catch (e) {
            console.warn('OAuth direct exchange error, passing code to root:', e);
          }

          // Fallback: pass code to root SPA
          window.location.href = '/?discord_code=' + encodeURIComponent(code);
          return;
        }

        // Default: redirect back to root dashboard
        window.location.href = '/';
      } catch (err) {
        console.error('Callback error:', err);
        window.location.href = '/?auth_error=' + encodeURIComponent(err.message || 'Authentication failed');
      }
    })();
  </script>
</body>
</html>
