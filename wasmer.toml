[package]
name = "roniguardreal"
version = "3.2.0"
description = "RONIGUARD Lua and Luau Script Protection & Licensing System"
entrypoint = "server"

[dependencies]
"sharrattj/node" = "*"

[fs]
"/app" = "."

[[command]]
name = "server"
package = "sharrattj/node"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/app/server.js"]
env = ["NODE_ENV=production", "PORT=8080"]
